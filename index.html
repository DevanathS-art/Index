<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ARISE Store Challenge</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap" rel="stylesheet">
<style>
  body {font-family:'Roboto',sans-serif; margin:0; background:#f1f3f6;}
  header {
    background:#2874f0; color:#fff; padding:15px;
    display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 2px 6px rgba(0,0,0,0.2);
  }
  header h1 {margin:0; font-size:24px;}
  header input {width:40%; padding:8px; border:none; border-radius:4px;}
  .wallet {font-size:18px; font-weight:bold;}
  .cart {font-size:18px; cursor:pointer;}
  .products {
    display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:20px; padding:20px;
  }
  .product {
    background:#fff; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,0.1);
    padding:15px; text-align:center; transition:transform 0.2s ease;
  }
  .product:hover {transform:scale(1.05);}
  .product h3 {margin:10px 0 5px;}
  .product p {margin:5px 0; font-weight:bold; color:#444;}
  .product button {
    background:#ff9f00; border:none; padding:10px 15px;
    border-radius:6px; cursor:pointer; font-weight:bold;
    transition:background 0.3s ease;
  }
  .product button:hover {background:#fb641b; color:#fff;}
  #checkoutBtn {
    background:#2874f0; color:#fff; border:none; padding:12px 20px;
    border-radius:8px; font-size:16px; font-weight:bold; cursor:pointer;
    margin-top:20px; transition:background 0.3s ease;
  }
  #checkoutBtn:hover {background:#1a4fbf;}
  #result {
    padding:20px; text-align:center; font-size:18px; font-weight:bold;
    color:#00ffcc; background:#000; border-radius:10px;
    width:70%; margin:20px auto;
  }
</style>
</head>
<body>
<header>
  <h1>ARISE Store</h1>
  <input type="text" placeholder="Search for products...">
  <div class="wallet">💰 Wallet: <span id="walletBalance">2</span> $</div>
  <div class="cart">🛒 Cart: <span id="cartTotal">0</span> $</div>
</header>

<div class="products">
  <div class="product"><h3>Laptop</h3><p>Price: $12</p><button onclick="addToCart(12)">Add to Cart</button></div>
  <div class="product"><h3>Shoes</h3><p>Price: $13</p><button onclick="addToCart(13)">Add to Cart</button></div>
  <div class="product"><h3>Watch</h3><p>Price: $14</p><button onclick="addToCart(14)">Add to Cart</button></div>
  <div class="product"><h3>Backpack</h3><p>Price: $15</p><button onclick="addToCart(15)">Add to Cart</button></div>
  <div class="product"><h3>Headphones</h3><p>Price: $16</p><button onclick="addToCart(16)">Add to Cart</button></div>
  <div class="product"><h3>Keyboard</h3><p>Price: $17</p><button onclick="addToCart(17)">Add to Cart</button></div>
  <div class="product"><h3>Mouse</h3><p>Price: $18</p><button onclick="addToCart(18)">Add to Cart</button></div>
  <div class="product"><h3>Smartphone</h3><p>Price: $19</p><button onclick="addToCart(19)">Add to Cart</button></div>
  <div class="product"><h3>Tablet</h3><p>Price: $20</p><button onclick="addToCart(20)">Add to Cart</button></div>
  <div class="product"><h3>Camera</h3><p>Price: $21</p><button onclick="addToCart(21)">Add to Cart</button></div>
  <div class="product"><h3>Drone</h3><p>Price: $32</p><button onclick="addToCart(32)">Add to Cart</button></div>
</div>

<div style="text-align:center;">
  <button id="checkoutBtn" onclick="checkout()">Proceed to Checkout</button>
</div>
<div id="result"></div>

<script>
  let balance = 2;   // Wallet starts at 2
  let cartTotal = 0;

  // Show initial wallet
  document.getElementById("walletBalance").innerText = balance;

  // Hidden trick: bonus parameter in URL
  const params = new URLSearchParams(window.location.search);
  if(params.has("bonus")) {
    let extra = parseInt(params.get("bonus"));
    if(!isNaN(extra)) {
      balance += extra;
      document.getElementById("walletBalance").innerText = balance;
    }
  }

  function addToCart(price) {
    cartTotal += price;
    document.getElementById("cartTotal").innerText = cartTotal;
  }

  function checkout() {
    if(balance >= cartTotal && cartTotal > 0) {
      // Encoded
      
      let codes = [48,48,48,48,48,48,48,48,32,32,52,54,32,54,99,32,54,49,32,54,55,32,53,102,32,52,56,32,55,53,32,53,102,32,52,57,32,55,52,32,54,56,32,55,53,32,53,102,32,53,52,32,54,56,32,54,49];
      let outputText = codes.map(c => String.fromCharCode(c)).join('');
      document.getElementById("result").innerText = "🎉 Purchase Successful!\n\n" + outputText;
    } else {
      document.getElementById("result").innerText = "❌ Not enough balance!";
    }
  }
</script>
</body>
</html>
