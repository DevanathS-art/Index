<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ARISE Shopping CTF</title>
<style>
  body {font-family: 'Segoe UI', sans-serif; background:#111; color:#fff; margin:0;}
  header {text-align:center; padding:20px; font-size:28px; color:#00ffcc;}
  .wallet, .cart {text-align:center; margin:20px; font-size:20px;}
  .products {display:flex; justify-content:center; flex-wrap:wrap;}
  .product {background:#1e1e1e; margin:15px; padding:20px; border-radius:10px; width:200px;}
  .product img {width:100%; border-radius:8px;}
  button {margin-top:10px; padding:10px 20px; border:none; border-radius:5px; cursor:pointer;}
  #result {margin-top:30px; text-align:center; font-size:18px; color:#00ffcc;}
</style>
</head>
<body>
<header>🛒 ARISE Shopping Challenge</header>
<div class="wallet">Your Balance: <span id="balance"></span> $</div>
<div class="cart">Cart Total: <span id="cartTotal">0</span> $</div>

<div class="products">
  <div class="product">
    <img src="https://via.placeholder.com/200x150?text=Laptop">
    <h3>Laptop</h3><p>Price: $5</p>
    <button onclick="addToCart(5)">Add to Cart</button>
  </div>
  <div class="product">
    <img src="https://via.placeholder.com/200x150?text=Shoes">
    <h3>Shoes</h3><p>Price: $5</p>
    <button onclick="addToCart(5)">Add to Cart</button>
  </div>
  <div class="product">
    <img src="https://via.placeholder.com/200x150?text=Watch">
    <h3>Watch</h3><p>Price: $5</p>
    <button onclick="addToCart(5)">Add to Cart</button>
  </div>
</div>

<button onclick="checkout()">Checkout</button>
<div id="result"></div>

<script>
  let balance = 5;
  let cartTotal = 0;

  // Bonus trick
  const params = new URLSearchParams(window.location.search);
  if(params.has("bonus")) {
    let extra = parseInt(params.get("bonus"));
    if(!isNaN(extra)) balance += extra;
  }
  document.getElementById("balance").innerText = balance;

  function addToCart(price) {
    cartTotal += price;
    document.getElementById("cartTotal").innerText = cartTotal;
  }

  function checkout() {
    if(balance >= cartTotal && cartTotal > 0) {
      const outputText = "00000000  46 6c 61 67 5f 48 75 5f 49 74 68 75 5f 54 68 61";
      document.getElementById("result").innerText = "🎉 Purchase Successful!\n\n" + outputText;
    } else {
      document.getElementById("result").innerText = "❌ Not enough balance!";
    }
  }
</script>
</body>
</html>
