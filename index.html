<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ARISE Store</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap" rel="stylesheet">
<style>
  body {font-family:'Roboto',sans-serif; margin:0; background:#f1f3f6;}
  header {background:#2874f0; color:#fff; padding:15px; display:flex; align-items:center; justify-content:space-between;}
  header h1 {margin:0; font-size:24px;}
  header input {width:40%; padding:8px; border:none; border-radius:4px;}
  .cart {font-size:18px; cursor:pointer;}
  .products {display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:20px; padding:20px;}
  .product {background:#fff; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.1); padding:15px; text-align:center;}
  .product h3 {margin:10px 0 5px;}
  .product p {margin:5px 0;}
  .product button {background:#ff9f00; border:none; padding:10px; border-radius:4px; cursor:pointer; font-weight:bold;}
  .product button:hover {background:#fb641b; color:#fff;}
  #result {padding:20px; text-align:center; font-size:18px; font-weight:bold; color:#00ffcc; background:#000; border-radius:10px; width:70%; margin:20px auto;}
</style>
</head>
<body>
<header>
  <h1>ARISE Store</h1>
  <input type="text" placeholder="Search for products...">
  <div class="cart">🛒 Cart: <span id="cartTotal">0</span> $</div>
</header>

<div class="products">
  <div class="product"><h3>Laptop</h3><p>Price: $5</p><button onclick="addToCart(5)">Add to Cart</button></div>
  <div class="product"><h3>Shoes</h3><p>Price: $5</p><button onclick="addToCart(5)">Add to Cart</button></div>
  <div class="product"><h3>Watch</h3><p>Price: $5</p><button onclick="addToCart(5)">Add to Cart</button></div>
  <div class="product"><h3>Backpack</h3><p>Price: $5</p><button onclick="addToCart(5)">Add to Cart</button></div>
  <div class="product"><h3>Headphones</h3><p>Price: $5</p><button onclick="addToCart(5)">Add to Cart</button></div>
  <div class="product"><h3>Keyboard</h3><p>Price: $5</p><button onclick="addToCart(5)">Add to Cart</button></div>
  <div class="product"><h3>Mouse</h3><p>Price: $5</p><button onclick="addToCart(5)">Add to Cart</button></div>
  <div class="product"><h3>Smartphone</h3><p>Price: $5</p><button onclick="addToCart(5)">Add to Cart</button></div>
  <div class="product"><h3>Tablet</h3><p>Price: $5</p><button onclick="addToCart(5)">Add to Cart</button></div>
  <div class="product"><h3>Camera</h3><p>Price: $5</p><button onclick="addToCart(5)">Add to Cart</button></div>
</div>

<div style="text-align:center;">
  <button onclick="checkout()">Proceed to Checkout</button>
</div>
<div id="result"></div>

<script>
  let balance = 5;
  let cartTotal = 0;

  // Bonus trick
  const params = new URLSearchParams(window.location.search);
  if(params.has("bonus")) {
    let extra = parseInt(params.get("bonus"));
    if(!isNaN(extra)) balance += extra;
  }

  function addToCart(price) {
    cartTotal += price;
    document.getElementById("cartTotal").innerText = cartTotal;
  }

  function checkout() {
    if(balance >= cartTotal && cartTotal > 0) {
      const outputText = "00000000  46 6c 61 67 5f 48 75 5f 49 74 68 75 5f 54 68 61";
      document.getElementById("result").innerText = "🎉 Purchase Successful!\n\n" + outputText;
    } else {
      document.getElementById("result").innerText = "❌ Not enough balance!";
    }
  }
</script>
</body>
</html>
